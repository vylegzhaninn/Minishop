services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minishop
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: minishop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    environment:
      CLICKHOUSE_DB: minishop
      CLICKHOUSE_USER: minishop
      CLICKHOUSE_PASSWORD: minishop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    volumes: [chdata:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  orders-api:
    build:
      context: .
      dockerfile: src/Orders/Orders.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080;http://+:8081
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=minishop;Username=minishop;Password=minishop
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: orders.events
    ports: ["8080:8080", "8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}

  analytics-worker:
    build:
      context: .
      dockerfile: src/Analytics/Analytics.Worker/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8082
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: orders.events
      Kafka__GroupId: analytics-worker
      ClickHouse__Host: clickhouse
      ClickHouse__Port: 8123
      ClickHouse__Database: minishop
      ClickHouse__Username: minishop
      ClickHouse__Password: minishop
    ports: ["8082:8082"]
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

volumes:
  pgdata:
  chdata:
